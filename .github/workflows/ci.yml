name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer push to a branch cancels its in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: gateway (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: node/gateway/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: node/gateway/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  # Replay harness: testcontainers Redpanda + the real Node gateway in the loop.
  # Needs Docker (present on ubuntu runners) and the gateway's node_modules
  # (the test builds dist/ itself via the installed tsc).
  integration:
    name: integration (replay harness)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: node/gateway/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: node/gateway/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: node/gateway
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: python
      # CLI -m overrides the default `-m 'not integration'` in addopts.
      - run: uv run pytest -q -m integration
        working-directory: python

  # Lint the ops config this repo ships but no app test parses: a broken alert
  # expr or malformed dashboard JSON would otherwise fail silently at runtime.
  # promtool comes from the same prom/prometheus image compose deploys.
  config:
    name: config (promtool + dashboards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config + rules
        run: |
          docker run --rm -w /ops/prometheus -v "$PWD/ops:/ops" --entrypoint /bin/promtool \
            prom/prometheus:v3.12.0 check config prometheus.yml
          docker run --rm -w /ops/prometheus -v "$PWD/ops:/ops" --entrypoint /bin/promtool \
            prom/prometheus:v3.12.0 check rules alerts.yml
      - name: validate dashboard JSON
        run: |
          for f in ops/grafana/dashboards/*.json; do
            echo "checking $f"
            jq empty "$f"
          done
