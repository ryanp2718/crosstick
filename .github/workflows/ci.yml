name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer push to a branch cancels its in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: gateway (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node/gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: node/gateway/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: node/gateway/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run format:check
      - run: pnpm test

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # Replay harness: testcontainers Redpanda + the real Node gateway in the loop.
  # Needs Docker (present on ubuntu runners) and the gateway's node_modules
  # (the test builds dist/ itself via the installed tsc).
  integration:
    name: integration (replay harness)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: node/gateway/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: node/gateway/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: node/gateway
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: python
      # CLI -m overrides the default `-m 'not integration'` in addopts.
      - run: uv run pytest -q -m integration
        working-directory: python

  # Lint the ops config this repo ships but no app test parses: a broken alert
  # expr or malformed dashboard JSON would otherwise fail silently at runtime.
  # promtool comes from the same prom/prometheus image compose deploys.
  config:
    name: config (promtool + dashboards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: promtool check config + rules
        run: |
          docker run --rm -w /ops/prometheus -v "$PWD/ops:/ops" --entrypoint /bin/promtool \
            prom/prometheus:v3.12.0 check config prometheus.yml
          docker run --rm -w /ops/prometheus -v "$PWD/ops:/ops" --entrypoint /bin/promtool \
            prom/prometheus:v3.12.0 check rules alerts.yml
      - name: validate dashboard JSON
        run: |
          for f in ops/grafana/dashboards/*.json; do
            echo "checking $f"
            jq empty "$f"
          done

  # House-style guard: zero em-dashes (U+2014) in tracked files.
  conventions:
    name: conventions (no em-dash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check_no_em_dash.py
