name: security

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so newly disclosed vulns in unchanged deps surface without a PR.
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secret scan over the full commit history. Runs the MIT gitleaks CLI image
  # directly rather than gitleaks-action, whose license gates private repos.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git /repo --redact --verbose

  # On PRs, audit only when dependencies change: a new advisory should not turn
  # every unrelated PR red. A skipped job still satisfies the required check.
  deps-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- \
              node/gateway/package.json node/gateway/pnpm-lock.yaml \
              node/gateway/pnpm-workspace.yaml python/pyproject.toml python/uv.lock \
              .github/workflows/security.yml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  audit:
    name: dependency audit
    needs: deps-changed
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.deps-changed.outputs.changed != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: node/gateway/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: node/gateway/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: node/gateway
      - run: pnpm audit --audit-level high
        working-directory: node/gateway

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: python
      - run: uv run --with pip-audit pip-audit
        working-directory: python

  # Static analysis. CodeQL code scanning is free on public repos; findings
  # land in the Security tab. Both languages are interpreted here, so build-mode
  # is none (CodeQL reads source directly, no compile step).
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: initialize codeql
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          language: ${{ matrix.language }}
          build-mode: none
      - name: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
