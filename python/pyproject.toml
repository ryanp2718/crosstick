[project]
name = "crosstick"
version = "0.1.0"
description = "Polyglot crypto market-data ingest + analytics platform"
requires-python = ">=3.11"
dependencies = [
    "websockets==16.0",
    "httpx==0.28.1",
    "msgspec==0.21.1",
    "sortedcontainers==2.4.0",
    "aiokafka==0.14.0",
    "pyarrow==24.0.0",
    "numpy==2.4.6",
    "prometheus-client==0.25.0",
    "uvloop==0.22.1; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ingest/tests", "analytics/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
