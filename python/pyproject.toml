[project]
name = "crosstick"
version = "0.1.0"
description = "Polyglot crypto market-data ingest + analytics platform"
requires-python = ">=3.11"
dependencies = [
    "websockets==17.0.1",
    "httpx==0.28.1",
    "msgspec==0.21.1",
    "sortedcontainers==2.4.0",
    "aiokafka==0.14.0",
    "pyarrow==25.0.0",
    "numpy==2.4.6",
    "prometheus-client==0.26.0",
    "pyyaml==6.0.3",
    "uvloop==0.22.1; sys_platform != 'win32'",
]

# Modelling only. Kept out of the runtime deps so the service images (ingest,
# materializer, silver/gold batch) don't carry scipy/sklearn. An extra rather than a
# dependency-group because a group cannot be installed from a URL, and the notebook repo
# installs this package with `pip install "crosstick[research] @ git+...@<sha>"`.
[project.optional-dependencies]
research = [
    "polars==1.43.2",
    "scikit-learn==1.9.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# Patterns, not a list of directories. The service image installs this package with only
# pyproject.toml present (Dockerfile:12, a dependency-cache layer), where a named
# directory would be a missing-package error and a pattern matching nothing is not.
[tool.setuptools.packages.find]
include = [
    "analytics*", "common*", "exporter*", "gold*",
    "ingest*", "materializer*", "research*", "silver*",
]
exclude = ["*.tests", "*.tests.*"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
    "testcontainers==4.15.0",
]
# The extra, so `uv sync` keeps installing it and the pins stay in one place.
research = ["crosstick[research]"]

[tool.uv]
# Both groups install for local dev and CI (`uv sync`). The service images build with
# `uv pip install .` (main deps only), so research never reaches a runtime container.
default-groups = ["dev", "research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "ingest/tests", "analytics/tests", "materializer/tests",
    "common/tests", "silver/tests", "gold/tests", "exporter/tests",
    "research/tests",
]
pythonpath = ["."]
# Integration tests need Docker (testcontainers); excluded by default so the
# unit suite stays fast. CI runs them in a separate job via `-m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: requires Docker (testcontainers); run with -m integration",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
