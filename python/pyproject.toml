[project]
name = "crypto-md"
version = "0.1.0"
description = "Polyglot crypto market-data ingest + analytics platform"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "msgspec>=0.18",
    "sortedcontainers>=2.4",
    "redis[hiredis]>=5.0",
    "numpy>=2.0",
    "polars>=1.0",
    "prometheus-client>=0.20",
    "uvloop>=0.20; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ingest/tests", "analytics/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
