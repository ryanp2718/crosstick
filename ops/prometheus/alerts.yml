# Prometheus alert rules. Rules evaluate in-process and surface in the
# Prometheus ALERTS view + the Grafana data-quality dashboard; notification
# routing (Alertmanager) is a deliberate follow-on, not configured here.
groups:
  - name: crosstick-data-quality
    rules:
      # Per-venue internal crossed book (ask < bid within one exchange): the
      # 06-12/13 warm-start failure that was entirely unobserved. Should read 0
      # post epoch-fix; any non-zero rate is a reconstruction regression.
      - alert: GatewayBBOCrossed
        expr: sum by (exchange) (rate(gateway_bbo_crossed_total[5m])) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Crossed BBO reconstructed for {{ $labels.exchange }}"
          description: "gateway_bbo_crossed_total is rising: the gateway is emitting a crossed within-venue book for {{ $labels.exchange }}."

      # Cross-venue NBBO inversion (best_bid >= best_ask across exchanges) deep
      # enough to matter. Fresh cross-venue locks/crosses of 1-2 bps are normal
      # fragmented-market microstructure (measured ~26k/h benign), so paging on
      # gateway_nbbo_crossed_total would be pure noise; the gateway floors that at
      # NBBO_CROSS_MIN_BPS (10) into _material_total, and only a real tens-of-bps
      # inversion (corrupt venue book, canonical mismap, basis leak) reaches it.
      # The floor is global, not per-canonical: it fits the current BTC/ETH two-
      # spot-venue set and would need revisiting for a low-priced or coarser-tick
      # instrument. Raw gateway_nbbo_crossed_total stays on the data-quality board.
      - alert: GatewayNBBOCrossed
        expr: sum by (canonical_id) (rate(gateway_nbbo_crossed_material_total[5m])) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Material crossed NBBO for {{ $labels.canonical_id }}"
          description: "Cross-venue spread on {{ $labels.canonical_id }} inverted by >= NBBO_CROSS_MIN_BPS with both winning legs fresh, beyond benign microstructure: a corrupt venue book, canonical mismap, or sustained dislocation."

      # Ingester book-invariant violations (snapshot_crossed / non_monotonic_seq
      # / crossed_after_delta). Source-side corruption caught before publish.
      - alert: BookInvariantViolations
        expr: sum by (exchange, kind) (rate(md_book_invariant_violations_total[5m])) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Book invariant violations on {{ $labels.exchange }} ({{ $labels.kind }})"
          description: "An ingester book failed an invariant and resynced. Repeated firing means a persistent feed or reconstruction problem."

      # Elevated full-resync rate. Threshold was 0.2/s and never fired: through the
      # 2026-08-31 kraken CRC storm this reached `pending` and stopped there, because
      # kraken's longest continuous run above 0.2 was 6m against the 10m `for`. Its
      # own cited incident could not have fired it either: 06-12's 814 resyncs/day
      # average 0.0094/s, 21x under the threshold they were meant to justify. The
      # limit had been set near the p95 of the pathology (0.196) rather than above
      # health, so a venue resyncing every ~26s for months paged nobody.
      #
      # Recalibrated against measured health, not against the incident. Over 24h
      # spanning both regimes, longest continuous run above 0.02/s: kraken 36m,
      # coinbase 0m, binance 0m, binance-futures 0m. 0.02/s is the lowest threshold
      # at which every healthy venue scores a zero-length run, and it fires here with
      # 3.6x margin on the `for` window. It also stands on its own terms: 0.02/s is
      # one resync per 50s sustained for 10m, which no healthy feed does.
      - alert: BookResyncStorm
        expr: sum by (exchange) (rate(md_book_resyncs_total[5m])) > 0.02
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Book resync storm on {{ $labels.exchange }}"
          description: "{{ $labels.exchange }} is resyncing its order book repeatedly (>0.02/s for 10m, i.e. faster than one resync per 50s): a reconnect storm, a flapping feed, or an integrity check rejecting good data."

  - name: crosstick-liveness
    rules:
      # Venue health from md.status.* / liveness timeout, as seen by the gateway.
      - alert: VenueDown
        expr: gateway_venue_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Venue {{ $labels.exchange }} is down"
          description: "The gateway has not seen a fresh md.status heartbeat for {{ $labels.exchange }}: the ingester is likely down or disconnected."

      # Gateway falling behind the durable log.
      - alert: GatewayConsumerLagHigh
        expr: gateway_consumer_lag_messages > 50000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Gateway consumer lag high ({{ $labels.topic }} p{{ $labels.partition }})"
          description: "gateway_consumer_lag_messages > 50000 for 5m on {{ $labels.topic }} p{{ $labels.partition }}: the gateway is not keeping up with ingest."

      # Materializer falling behind ingest (bronze projection). 10m (vs the gateway's
      # 5m) rides out the consume pauses during a 16MB zstd PUT, so only a sustained
      # backlog fires. Complements BronzeLakeStale: lag catches behind-but-flushing,
      # freshness catches up-but-stuck.
      - alert: MaterializerLagHigh
        expr: bronze_consumer_lag_messages > 50000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Materializer consumer lag high ({{ $labels.topic }} p{{ $labels.partition }})"
          description: "bronze_consumer_lag_messages > 50000 for 10m on {{ $labels.topic }} p{{ $labels.partition }}: the materializer is not keeping up with ingest; bronze will fall behind."

      # Any scrape target unreachable (crashed service, bad target). The safety
      # net that keeps a misconfigured scrape from being silent.
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Scrape target down: {{ $labels.job }} ({{ $labels.instance }})"
          description: "Prometheus cannot scrape {{ $labels.instance }} in job {{ $labels.job }}."

      # Live host capture-clock regression, at the source (vs the per-build
      # gold_dq_clock_* the scorecard derives from silver). NTP slew never steps
      # backward, so any backward step between consecutive WS frames is a fault.
      # Floored on magnitude (the worst step since process start), mirroring the
      # batch CaptureClockStepLarge. 1000ms, not 100: beyond the sub-10ms
      # WSL2 steady residual (06-28 worst 5.3ms), the 07-01 shakedown recorded a
      # single host-level event (VM pause or one NTP step) landing ~300ms on all
      # four feeds at once, and since the gauge is a since-start high-water mark
      # a 100ms floor latches on that benign event until the next restart. 1000ms
      # clears both regimes while still surfacing a real fault rather than letting
      # it silently clear. Predicted to read 0 on cloud+chrony.
      - alert: RecvClockBackwardStep
        expr: max by (exchange) (md_recv_clock_worst_step_ms) > 1000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Host capture clock stepped backward ({{ $labels.exchange }})"
          description: "md_recv_clock_worst_step_ms is {{ $value }}ms for {{ $labels.exchange }} (>1000ms floor, past the WSL2 residual and host-level pause steps): the capture host's wall clock went backward between consecutive WS frames. See host-clock-skew."

      # Process restart marker. Info-severity; also the empirical close-out
      # signal for the epoch fix (watch bbo_crossed across a restart).
      - alert: GatewayRestarted
        expr: changes(gateway_process_start_time_seconds[15m]) > 0
        labels: { severity: info }
        annotations:
          summary: "Gateway restarted"
          description: "The gateway process restarted in the last 15m: expect a warm-start; gateway_bbo_crossed_total should stay ~0 across it."

  # Batch/analytics tier, surfaced by the lake-exporter (reads gold + the lake).
  - name: crosstick-lakehouse
    rules:
      # Materializer stuck: even the busiest bronze dataset hasn't been written in
      # 30m (2x the 900s flush interval). min() over datasets avoids false positives
      # on genuinely sparse topics (liquidations only fire during volatility).
      - alert: BronzeLakeStale
        expr: min(lake_freshness_seconds{layer="bronze"}) > 1800
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Bronze lake stale (>30m, no dataset written)"
          description: "No new bronze object across any dataset for >30m: the materializer is likely stuck (up but not flushing) or the ingest feeds are down."

      # Batch-tier capture-clock fault canary: the worst intra-epoch backward recv
      # step in the latest gold build. Live-tier analog is RecvClockBackwardStep -
      # same phenomenon and same 1000ms floor, one read from the lake and one from
      # the ingesters. Measured over every scorecard row on current-vintage dates
      # (2026-06-27..07-25, n=56): median 0, p95 21ms, worst 54ms (kraken, 07-13).
      # 1000ms clears that ~18x and still catches the ~1.9s host sleep/resume step.
      #
      # This does NOT predict a silver LatenessError and no longer claims to. The
      # scorecard derives it from same-epoch deltas only, excluding the snapshot and
      # epoch interleave that dominate the fold-order disorder `reorder` buffers: on
      # 2026-07-13 this gauge read 54ms while the worst fold lateness was 151s. A
      # reorder-headroom gauge is the follow-up; LatenessError already fails loud.
      - alert: CaptureClockStepLarge
        expr: gold_dq_clock_worst_ms > 1000
        labels: { severity: warning }
        annotations:
          summary: "Large capture-clock backward step ({{ $labels.exchange }}/{{ $labels.symbol }})"
          description: "Worst intra-epoch backward recv step {{ $value }}ms in the latest gold build (>1000ms floor, measured worst real day 54ms): the capture host's clock stepped backward. See host-clock-skew."

      # Elevated step COUNT. Measured over 26 dates (2026-06-27..07-27): the median
      # scorecard row is 2 and the worst is 95, all of the tail is kraken (mean 28,
      # p95 70) and no other venue exceeds 14. The old >1000 came from the
      # pre-clocksource-fix era and now sits 10x above the worst real day, so a 5x
      # regression would never reach it. 100 leads the DQ budget's hard limit of 200
      # (ops/dq_budgets.yml): warn when kraken doubles or anyone else goes 7x, fail
      # the gold build only when it doubles again.
      - alert: ClockStepsElevated
        expr: gold_dq_violations{check="clock_monotonic"} > 100
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Elevated capture-clock backward steps ({{ $labels.exchange }}/{{ $labels.symbol }})"
          description: "{{ $value }} intra-epoch backward recv steps in the latest gold build (measured worst day 95, kraken): suspect a stopped/again-drifting host clock."

      # The exporter itself stopped refreshing: gold DQ/basis/freshness gauges are
      # stale even though the scrape target is up. Distinct from TargetDown.
      - alert: LakeExporterStale
        expr: time() - lake_exporter_last_success_seconds > 600
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Lake-exporter refresh stale (>10m)"
          description: "The lake-exporter has not completed a successful lake snapshot refresh in >10m (lake_exporter_refresh_errors_total rising?): its gold/basis/freshness gauges are stale."
