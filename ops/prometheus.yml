global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Docker-Desktop's Linux VM clock drifts from the host and resyncs
# non-monotonically; on a 5s scrape interval that can push a scrape behind the
# TSDB head, so the whole batch is rejected ("out-of-order samples"). Accept
# late samples within a 5m window instead of dropping them.
storage:
  tsdb:
    out_of_order_time_window: 5m

scrape_configs:
  - job_name: ingest
    # Dev mode runs the ingesters on the host; start each with a distinct
    # METRICS_PORT (binance 9101, coinbase 9102, kraken 9103). Container mode
    # would target ingest-<exchange>:910x once those services land in compose.
    static_configs:
      - targets: ["host.docker.internal:9101"]  # binance
        labels: { exchange: binance }
      - targets: ["host.docker.internal:9102"]  # coinbase
        labels: { exchange: coinbase }
      - targets: ["host.docker.internal:9103"]  # kraken
        labels: { exchange: kraken }
      - targets: ["host.docker.internal:9104"]  # binance-futures
        labels: { exchange: binance-futures }
  - job_name: materializer
    # Dev mode: host process on 9110. Container mode: materializer:9110.
    static_configs:
      - targets: ["host.docker.internal:9110"]
  - job_name: gateway
    # /metrics is served on the WS port (8080) in both dev and container mode;
    # the container publishes 8080 to the host, so one target covers both.
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: redpanda
    static_configs:
      - targets: ["redpanda:9644"]
    metrics_path: /public_metrics
