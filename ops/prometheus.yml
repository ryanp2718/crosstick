global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ingest
    static_configs:
      - targets:
          - "ingest-binance:9101"
          - "ingest-coinbase:9102"
          - "ingest-kraken:9103"
  - job_name: materializer
    static_configs:
      - targets: ["materializer:9110"]
  - job_name: gateway
    # Dev mode runs the gateway on the host (port 8080, /metrics shared with WS).
    # Container mode would target gateway:9120 once the image exposes it there.
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: redpanda
    static_configs:
      - targets: ["redpanda:9644"]
    metrics_path: /public_metrics
