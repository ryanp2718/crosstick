global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Docker-Desktop's Linux VM clock drifts from the host and resyncs
# non-monotonically; on a 5s scrape interval that can push a scrape behind the
# TSDB head, so the whole batch is rejected ("out-of-order samples"). Accept
# late samples within a 5m window instead of dropping them.
storage:
  tsdb:
    out_of_order_time_window: 5m

rule_files:
  - alerts.yml

scrape_configs:
  # Targets are compose service DNS (Prometheus runs on the same network).
  # The TargetDown alert in alerts.yml makes any unreachable target loud, so a
  # mismatch can't go silent. To scrape an ingester run on the host for dev,
  # point its target at host.docker.internal:<METRICS_PORT> instead.
  - job_name: ingest
    static_configs:
      - targets: ["ingest-binance:9101"]
        labels: { exchange: binance }
      - targets: ["ingest-coinbase:9102"]
        labels: { exchange: coinbase }
      - targets: ["ingest-kraken:9103"]
        labels: { exchange: kraken }
      - targets: ["ingest-binance-futures:9104"]
        labels: { exchange: binance-futures }
  - job_name: materializer
    static_configs:
      - targets: ["materializer:9110"]
  - job_name: gateway
    # /metrics is served on the WS port (8080).
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: redpanda
    static_configs:
      - targets: ["redpanda:9644"]
    metrics_path: /public_metrics
