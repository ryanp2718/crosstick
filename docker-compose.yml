name: crosstick

# Kappa architecture: Redpanda topics = source of truth.
# Materializer projects topics to Parquet on MinIO; warehouse (DuckDB + dbt)
# queries the lake; gateway computes live derived signals (BBO, spread) from
# the same topic firehose it fans out to WS clients.

services:
  # ─── source of truth ──────────────────────────────────────────────────────
  # Pinned, not :latest: kafkajs is sensitive to broker behavior changes (the
  # v26 fetch-path default switch broke it); upgrade the broker deliberately.
  redpanda:
    image: redpandadata/redpanda:v26.1.9
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
    ports:
      - "19092:19092"   # Kafka API (external)
      - "18081:18081"   # Schema Registry (external)
      - "9644:9644"     # Admin API
    volumes:
      # Named volume: the log survives container recreation (image pull, config
      # change). Until the materializer lands, the log is the ONLY data store.
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Applies cluster-scoped configs that can't be passed as node `--set` flags.
  # - kafka_batch_max_bytes: see MAX_MESSAGE_BYTES in python/common/kafka_io.py.
  # - log_retention_ms: default is 7 days; until the materializer (Phase 1)
  #   projects topics to the lake, retention IS the data-loss horizon. 30 days,
  #   bounded so a forgotten dev stack can't fill the disk.
  # - fetch_read_strategy: v26 defaults to non_polling, which starves kafkajs
  #   fetches into Request/ListOffsets timeouts and crash loops; polling is the
  #   pre-v26 behavior the client is stable on.
  # - default_topic_partitions: already Redpanda's default, pinned because
  #   single-partition topics are what makes per-topic total order — and
  #   byte-identical NBBO replay — hold for auto-created topics.
  redpanda-init:
    image: redpandadata/redpanda:v26.1.9
    container_name: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ce"]
    command:
      - |
        rpk -X admin.hosts=redpanda:9644 cluster config set kafka_batch_max_bytes 8388608
        rpk -X admin.hosts=redpanda:9644 cluster config set log_retention_ms 2592000000
        rpk -X admin.hosts=redpanda:9644 cluster config set fetch_read_strategy polling
        rpk -X admin.hosts=redpanda:9644 cluster config set default_topic_partitions 1
    restart: "no"

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
      CONFIG_FILEPATH: ""
    ports:
      - "8090:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # ─── object store ─────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minio minio12345 &&
        mc mb -p local/lake &&
        mc mb -p local/silver &&
        mc mb -p local/gold &&
        echo 'buckets ready'
      "
    restart: "no"

  # ─── ingest (Python, one process per exchange) ────────────────────────────
  # All `build:` services bake their source into the image: deploying new code
  # needs `docker compose up -d --build <svc>`, not just `up -d`.
  ingest-binance:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "ingest.main"]
    environment:
      EXCHANGE: binance
      SYMBOLS: BTCUSDT,ETHUSDT
      KAFKA_BROKERS: redpanda:9092
      METRICS_PORT: "9101"
    ports:
      - "9101:9101"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  ingest-coinbase:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "ingest.main"]
    environment:
      EXCHANGE: coinbase
      SYMBOLS: BTC-USD,ETH-USD
      KAFKA_BROKERS: redpanda:9092
      METRICS_PORT: "9102"
    ports:
      - "9102:9102"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # Perp capture: liquidations, mark/funding, open-interest poll, L2 book +
  # aggTrade tape (DESIGN_perp_capture.md slices 1-3).
  ingest-binance-futures:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "ingest.main"]
    environment:
      EXCHANGE: binance-futures
      SYMBOLS: BTCUSDT,ETHUSDT
      KAFKA_BROKERS: redpanda:9092
      METRICS_PORT: "9104"
    ports:
      - "9104:9104"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  ingest-kraken:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "ingest.main"]
    environment:
      EXCHANGE: kraken
      SYMBOLS: BTC/USD,ETH/USD
      KAFKA_BROKERS: redpanda:9092
      METRICS_PORT: "9103"
    ports:
      - "9103:9103"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # ─── stream materializer (Kappa: stream → Parquet projection) ─────────────
  materializer:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "-m", "materializer.main"]
    environment:
      KAFKA_BROKERS: redpanda:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: lake
      INSTRUMENTS_FILE: /app/ops/instruments.yml
      METRICS_PORT: "9110"
      # Size-dominant flush: the interval is the bronze-lag bound for cold
      # topics, not the primary trigger (DESIGN_analytics.md → Partitioning).
      FLUSH_INTERVAL_SEC: "900"
      FLUSH_BYTES: "16777216"   # 16 MiB
    volumes:
      - ./ops/instruments.yml:/app/ops/instruments.yml:ro
    ports:
      - "9110:9110"
    depends_on:
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─── Node gateway: fanout + live BBO/spread derivation ────────────────────
  gateway:
    build:
      context: .
      dockerfile: ./node/gateway/Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
      WS_PORT: "8080"
    volumes:
      # Mounted over the baked copy so instrument edits don't need a rebuild.
      - ./ops/instruments.yml:/app/ops/instruments.yml:ro
    ports:
      - "8080:8080"   # WS + dashboard + /metrics (no separate metrics port)
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # ─── observability ────────────────────────────────────────────────────────
  # Config-mounting services: prometheus/grafana read these mounts ONCE at
  # container creation. Editing a file under ops/ does NOT take effect on `up -d`
  # or `restart` (which reuse the existing container + its mounts); a file that
  # didn't exist at create time never materializes at all. After editing config
  # here, recreate: `docker compose up -d --force-recreate prometheus grafana`,
  # then verify with `python ops/smoke.py`. Images are pinned, not :latest, so
  # provisioning behavior can't shift under us (Grafana 13 quietly dropped the
  # updateIntervalSeconds dashboard auto-reload that earlier versions honored).
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    volumes:
      # Whole dir, not individual files: new rule files appear without editing
      # compose, and a bind of a not-yet-existing file can't silently no-op.
      - ./ops/prometheus:/etc/prometheus:ro
      # Named volume for the TSDB (/prometheus): metrics history otherwise lives
      # in the container layer and evaporates on every recreate/rebuild.
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.1-security-01
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # NOTE: airflow + spark services added in their respective build phases.

volumes:
  redpanda-data:
  minio-data:
  prometheus-data:
